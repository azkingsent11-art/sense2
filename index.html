<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>AR Lamborghini - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    #controlPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #statusText {
      color: white;
      background: rgba(0,0,0,0.68);
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    }

    #doorButton {
      pointer-events: auto;
      min-width: 220px;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      background: #f4c400;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
      transition: transform 0.15s, opacity 0.2s;
    }

    #doorButton:active {
      transform: scale(0.96);
    }

    #doorButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <!-- UI -->
  <div id="controlPanel">
    <div id="statusText">กรุณาส่องกล้องไปที่ Hiro Marker</div>
    <button id="doorButton" disabled>เปิดประตูรถ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Hiro Marker -->
    <a-marker id="hiroMarker" preset="hiro">

      <!-- Lamborghini-style supercar -->
      <a-entity
        id="car"
        position="0 0.15 0"
        rotation="0 0 0"
        scale="0.9 0.9 0.9"
      >

        <!-- ===== ตัวถังหลัก ===== -->
        <a-box
          position="0 0.34 0"
          width="1.75"
          height="0.34"
          depth="0.82"
          color="#F4C400"
          material="metalness: 0.25; roughness: 0.35">
        </a-box>

        <!-- ฝากระโปรงหน้า -->
        <a-box
          position="0 0.42 -0.43"
          width="1.42"
          height="0.13"
          depth="0.48"
          rotation="-6 0 0"
          color="#FFD20A"
          material="metalness: 0.22; roughness: 0.3">
        </a-box>

        <!-- ห้องโดยสาร -->
        <a-box
          position="0 0.62 0.10"
          width="1.20"
          height="0.34"
          depth="0.70"
          rotation="0 0 0"
          color="#202A31"
          material="metalness: 0.1; roughness: 0.25; opacity: 0.93">
        </a-box>

        <!-- กระจกหน้า -->
        <a-box
          position="0 0.67 -0.235"
          width="1.06"
          height="0.26"
          depth="0.025"
          rotation="-16 0 0"
          color="#4D7185"
          material="opacity: 0.68; transparent: true; metalness: 0.15">
        </a-box>

        <!-- กระจกหลัง -->
        <a-box
          position="0 0.66 0.445"
          width="0.94"
          height="0.22"
          depth="0.025"
          rotation="16 0 0"
          color="#3D6177"
          material="opacity: 0.64; transparent: true">
        </a-box>

        <!-- หลังคา -->
        <a-box
          position="0 0.81 0.09"
          width="0.90"
          height="0.08"
          depth="0.42"
          color="#171717">
        </a-box>

        <!-- ===== กันชนหน้า / สปลิตเตอร์ ===== -->
        <a-box
          position="0 0.20 -0.66"
          width="1.64"
          height="0.10"
          depth="0.12"
          color="#141414">
        </a-box>

        <!-- ช่องลมหน้า -->
        <a-box
          position="-0.47 0.27 -0.64"
          width="0.34"
          height="0.10"
          depth="0.04"
          color="#111111">
        </a-box>

        <a-box
          position="0.47 0.27 -0.64"
          width="0.34"
          height="0.10"
          depth="0.04"
          color="#111111">
        </a-box>

        <!-- ไฟหน้า -->
        <a-box
          position="-0.52 0.41 -0.665"
          width="0.34"
          height="0.07"
          depth="0.035"
          rotation="0 0 -6"
          color="#EAF7FF"
          material="emissive: #DFF5FF; emissiveIntensity: 0.8">
        </a-box>

        <a-box
          position="0.52 0.41 -0.665"
          width="0.34"
          height="0.07"
          depth="0.035"
          rotation="0 0 6"
          color="#EAF7FF"
          material="emissive: #DFF5FF; emissiveIntensity: 0.8">
        </a-box>

        <!-- ===== ด้านท้าย ===== -->
        <a-box
          position="0 0.28 0.52"
          width="1.60"
          height="0.25"
          depth="0.20"
          color="#E7B900">
        </a-box>

        <!-- ไฟท้าย -->
        <a-box
          position="-0.48 0.38 0.625"
          width="0.42"
          height="0.06"
          depth="0.03"
          color="#D21818"
          material="emissive: #B00000; emissiveIntensity: 0.7">
        </a-box>

        <a-box
          position="0.48 0.38 0.625"
          width="0.42"
          height="0.06"
          depth="0.03"
          color="#D21818"
          material="emissive: #B00000; emissiveIntensity: 0.7">
        </a-box>

        <!-- ดิฟฟิวเซอร์หลัง -->
        <a-box
          position="0 0.15 0.66"
          width="1.48"
          height="0.10"
          depth="0.10"
          color="#111111">
        </a-box>

        <!-- ===== ล้อ ===== -->
        <!-- ซ้ายหน้า -->
        <a-cylinder
          position="-0.81 0.21 -0.37"
          radius="0.22"
          height="0.16"
          rotation="0 0 90"
          color="#111111">
        </a-cylinder>
        <a-cylinder
          position="-0.895 0.21 -0.37"
          radius="0.13"
          height="0.025"
          rotation="0 0 90"
          color="#A8A8A8">
        </a-cylinder>

        <!-- ขวาหน้า -->
        <a-cylinder
          position="0.81 0.21 -0.37"
          radius="0.22"
          height="0.16"
          rotation="0 0 90"
          color="#111111">
        </a-cylinder>
        <a-cylinder
          position="0.895 0.21 -0.37"
          radius="0.13"
          height="0.025"
          rotation="0 0 90"
          color="#A8A8A8">
        </a-cylinder>

        <!-- ซ้ายหลัง -->
        <a-cylinder
          position="-0.81 0.21 0.35"
          radius="0.24"
          height="0.17"
          rotation="0 0 90"
          color="#111111">
        </a-cylinder>
        <a-cylinder
          position="-0.9 0.21 0.35"
          radius="0.14"
          height="0.025"
          rotation="0 0 90"
          color="#A8A8A8">
        </a-cylinder>

        <!-- ขวาหลัง -->
        <a-cylinder
          position="0.81 0.21 0.35"
          radius="0.24"
          height="0.17"
          rotation="0 0 90"
          color="#111111">
        </a-cylinder>
        <a-cylinder
          position="0.9 0.21 0.35"
          radius="0.14"
          height="0.025"
          rotation="0 0 90"
          color="#A8A8A8">
        </a-cylinder>

        <!-- ===== กระจกมองข้าง ===== -->
        <a-box
          position="-0.72 0.63 -0.17"
          width="0.18"
          height="0.07"
          depth="0.12"
          color="#F4C400">
        </a-box>

        <a-box
          position="0.72 0.63 -0.17"
          width="0.18"
          height="0.07"
          depth="0.12"
          color="#F4C400">
        </a-box>

        <!-- ===== ประตูซ้ายแบบ Scissor Door ===== -->
        <!-- จุดหมุนอยู่ใกล้เสา A ด้านหน้า -->
        <a-entity id="leftDoorPivot"
                  position="-0.63 0.62 -0.18"
                  rotation="0 0 0">

          <!-- ประตู -->
          <a-box
            position="0 0 0.28"
            width="0.08"
            height="0.48"
            depth="0.58"
            color="#FFD20A"
            material="metalness: 0.22; roughness: 0.32">
          </a-box>

          <!-- กระจกประตู -->
          <a-box
            position="0 0.17 0.24"
            width="0.088"
            height="0.18"
            depth="0.32"
            color="#385A6D"
            material="opacity: 0.68; transparent: true">
          </a-box>

          <!-- ช่องลมข้าง -->
          <a-box
            position="-0.046 -0.10 0.34"
            width="0.018"
            height="0.13"
            depth="0.16"
            color="#111111">
          </a-box>
        </a-entity>

        <!-- ===== ประตูขวาแบบ Scissor Door ===== -->
        <a-entity id="rightDoorPivot"
                  position="0.63 0.62 -0.18"
                  rotation="0 0 0">

          <a-box
            position="0 0 0.28"
            width="0.08"
            height="0.48"
            depth="0.58"
            color="#FFD20A"
            material="metalness: 0.22; roughness: 0.32">
          </a-box>

          <a-box
            position="0 0.17 0.24"
            width="0.088"
            height="0.18"
            depth="0.32"
            color="#385A6D"
            material="opacity: 0.68; transparent: true">
          </a-box>

          <a-box
            position="0.046 -0.10 0.34"
            width="0.018"
            height="0.13"
            depth="0.16"
            color="#111111">
          </a-box>
        </a-entity>

        <!-- ตราสัญลักษณ์แบบเรียบง่ายบนฝากระโปรง -->
        <a-circle
          position="0 0.505 -0.56"
          radius="0.055"
          rotation="-90 0 0"
          color="#111111">
        </a-circle>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const marker = document.getElementById("hiroMarker");
      const doorButton = document.getElementById("doorButton");
      const statusText = document.getElementById("statusText");

      const leftDoor = document.getElementById("leftDoorPivot");
      const rightDoor = document.getElementById("rightDoorPivot");

      let markerVisible = false;
      let doorsOpen = false;

      marker.addEventListener("markerFound", () => {
        markerVisible = true;
        doorButton.disabled = false;
        statusText.textContent = "พบ Hiro Marker แล้ว ✓";
      });

      marker.addEventListener("markerLost", () => {
        markerVisible = false;
        doorButton.disabled = true;
        statusText.textContent = "กรุณาส่องกล้องไปที่ Hiro Marker";
      });

      doorButton.addEventListener("click", () => {

        if (!markerVisible) return;

        doorsOpen = !doorsOpen;

        // ลบ animation เก่าก่อน
        leftDoor.removeAttribute("animation__door");
        rightDoor.removeAttribute("animation__door");

        if (doorsOpen) {

          // ประตูซ้ายยกขึ้นและกางออกเล็กน้อย
          leftDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 68; dur: 750; easing: easeInOutCubic"
          );

          // ประตูขวายกขึ้นตรงข้ามกัน
          rightDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 -68; dur: 750; easing: easeInOutCubic"
          );

          doorButton.textContent = "ปิดประตูรถ";
          statusText.textContent = "ประตูรถเปิดอยู่";

        } else {

          leftDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 0; dur: 750; easing: easeInOutCubic"
          );

          rightDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 0; dur: 750; easing: easeInOutCubic"
          );

          doorButton.textContent = "เปิดประตูรถ";
          statusText.textContent = "ประตูรถปิดอยู่";
        }
      });
    });
  </script>

</body>
</html>
